plugins {
    id 'application'
}

import org.gradle.api.file.DuplicatesStrategy
import org.gradle.internal.os.OperatingSystem

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:${gdxVersion}"
    implementation "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-desktop"
    implementation "com.badlogicgames.gdx:gdx-box2d-platform:${gdxVersion}:natives-desktop"
    implementation "com.badlogicgames.gdx:gdx-freetype-platform:${gdxVersion}:natives-desktop"
}

application {
    mainClass = 'com.rogueforge.game.lwjgl3.Lwjgl3Launcher'
    applicationDefaultJvmArgs = org.gradle.internal.os.OperatingSystem.current().isMacOsX() ?
        ['-XstartOnFirstThread'] : []
}

jar {
    dependsOn project(':core').tasks.named('jar')
    archiveFileName = 'rogue-forge.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': 'com.rogueforge.game.lwjgl3.Lwjgl3Launcher'
    }
    from configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
}

def os = OperatingSystem.current()
def packageOutputDir = layout.buildDirectory.dir('package')
def appImageOutputDir = layout.buildDirectory.dir('app-image')
def jpackageExecutable = new File(System.getProperty('java.home'), "bin/jpackage${os.isWindows() ? '.exe' : ''}")
def jpackageCommand = jpackageExecutable.exists() ? jpackageExecutable.absolutePath : 'jpackage'
def mainJarName = 'rogue-forge.jar'
def launcherClass = 'com.rogueforge.game.lwjgl3.Lwjgl3Launcher'

def baseJpackageArgs = [
    '--name', 'RogueForge',
    '--input', file("$buildDir/libs").absolutePath,
    '--main-jar', mainJarName,
    '--main-class', launcherClass
]

tasks.register('packageDmg', Exec) {
    group = 'distribution'
    description = 'Builds a macOS .dmg installer with jpackage.'
    dependsOn jar
    outputs.dir(packageOutputDir)

    doFirst {
        if (!os.isMacOsX()) {
            throw new GradleException('packageDmg must be run on macOS.')
        }
        if (!new File(jpackageCommand).exists() && jpackageCommand == 'jpackage') {
            logger.lifecycle('Using jpackage from PATH.')
        }
    }

    workingDir projectDir
    commandLine jpackageCommand,
        '--type', 'dmg',
        '--dest', packageOutputDir.get().asFile.absolutePath,
        *baseJpackageArgs,
        '--java-options', '-XstartOnFirstThread'
}

tasks.register('packageAppImage', Exec) {
    group = 'distribution'
    description = 'Builds a portable Windows app image with bundled runtime.'
    dependsOn jar
    outputs.dir(appImageOutputDir)

    doFirst {
        if (!os.isWindows()) {
            throw new GradleException('packageAppImage must be run on Windows.')
        }
        if (!new File(jpackageCommand).exists() && jpackageCommand == 'jpackage') {
            logger.lifecycle('Using jpackage from PATH.')
        }
    }

    workingDir projectDir
    commandLine jpackageCommand,
        '--type', 'app-image',
        '--dest', appImageOutputDir.get().asFile.absolutePath,
        *baseJpackageArgs
}

tasks.register('packageExe', Exec) {
    group = 'distribution'
    description = 'Builds a Windows .exe installer with jpackage.'
    dependsOn jar
    outputs.dir(packageOutputDir)

    doFirst {
        if (!os.isWindows()) {
            throw new GradleException('packageExe must be run on Windows.')
        }
        if (!new File(jpackageCommand).exists() && jpackageCommand == 'jpackage') {
            logger.lifecycle('Using jpackage from PATH.')
        }
    }

    workingDir projectDir
    commandLine jpackageCommand,
        '--type', 'exe',
        '--dest', packageOutputDir.get().asFile.absolutePath,
        *baseJpackageArgs
}
